<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Мои фильмы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--f-bg:#fff;--f-tx:#111;--f-card:#f1f1f4;--f-hint:#8a8a8e}
@media(prefers-color-scheme:dark){:root{--f-bg:#17181c;--f-tx:#f2f2f2;--f-card:#25272d;--f-hint:#8d9099}}
:root{--bg:var(--tg-theme-bg-color,var(--f-bg));--tx:var(--tg-theme-text-color,var(--f-tx));--card:var(--tg-theme-secondary-bg-color,var(--f-card));--hint:var(--tg-theme-hint-color,var(--f-hint));--acc:var(--tg-theme-button-color,#2f80ed);--acc-tx:var(--tg-theme-button-text-color,#fff);--ok:#34c759}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#top{padding:12px 12px 8px}
#q{width:100%;border:0;outline:0;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:16px;padding:11px 14px}
#q::placeholder{color:var(--hint)}
main{flex:1;overflow-y:auto;padding:4px 12px 16px}
#lbl{font-size:13px;color:var(--hint);margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px}
.c{cursor:pointer}
.p{position:relative;aspect-ratio:2/3;border-radius:10px;background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px}
.p img{width:100%;height:100%;object-fit:cover;display:block}
.p b{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--acc-tx);font-size:12px;line-height:22px;text-align:center}
.p b.w{background:var(--ok);color:#fff}
.t{font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.y{font-size:12px;color:var(--hint)}
#msg{text-align:center;color:var(--hint);padding:40px 16px}
#more{display:block;margin:18px auto 0;padding:10px 22px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
#cr{text-align:center;font-size:11px;color:var(--hint);margin-top:22px}
#tabs{display:flex;border-top:1px solid var(--card);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;color:var(--hint);font:inherit;font-size:13px;padding:13px 4px}
#tabs button.on{color:var(--acc);font-weight:600}
#tabs i{font-style:normal;margin-left:3px}
#sheet{position:fixed;inset:0;display:flex;align-items:flex-end;background:rgba(0,0,0,.45);z-index:9}
.box{width:100%;max-height:85%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.row{display:flex;gap:14px}
.ph{width:96px;aspect-ratio:2/3;border-radius:10px;background:var(--card) center/cover;flex:none}
.box h2{font-size:18px;line-height:1.25}
.m{color:var(--hint);font-size:13px;margin-top:6px}
#so{margin:14px 0;font-size:14px}
.btns{display:flex;gap:10px}
.btns button{flex:1;border:0;border-radius:12px;padding:13px 6px;background:var(--card);color:var(--tx);font:inherit;font-weight:600}
.btns button.on{background:var(--acc);color:var(--acc-tx)}
.btns button.on[data-s=w]{background:var(--ok);color:#fff}
</style>
</head>
<body>
<header id="top"><input id="q" type="search" placeholder="Найти фильм или сериал" autocomplete="off" enterkeyhint="search"></header>
<main id="main">
  <div id="lbl"></div>
  <div id="grid" class="grid"></div>
  <p id="msg"></p>
  <button id="more" hidden>Показать ещё</button>
  <div id="cr">Данные: TMDB</div>
</main>
<nav id="tabs">
  <button data-tab="search" class="on">Поиск</button>
  <button data-tab="p">Буду смотреть<i id="cp"></i></button>
  <button data-tab="w">Просмотрено<i id="cw"></i></button>
</nav>
<div id="sheet" hidden>
  <div class="box">
    <div class="row"><div class="ph" id="si"></div><div><h2 id="st"></h2><div class="m" id="sm"></div></div></div>
    <p id="so"></p>
    <div class="btns"><button data-s="p">🔖 Буду смотреть</button><button data-s="w">✓ Просмотрено</button></div>
  </div>
</div>

<script>
const TMDB_KEY='303c4d7cf826c726f5d9ba8aa211f733'; // бесплатный ключ: themoviedb.org → Settings → API
const API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/';
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.disableVerticalSwipes?.();
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='search',query='',lib={},seen={},results=[],page=1,pages=1,seq=0,busy=true,error='',cur=null;

/* Хранилище: облако Telegram (синхронизируется между устройствами) или localStorage в обычном браузере */
const cs=tg?.CloudStorage&&tg.isVersionAtLeast?.('6.9')?tg.CloudStorage:null;
const cloud=(m,...a)=>new Promise(r=>cs[m](...a,(e,v)=>r(e?null:v)));
async function load(){
  if(cs){
    const keys=(await cloud('getKeys'))||[];
    const vals=keys.length?(await cloud('getItems',keys))||{}:{};
    keys.forEach(k=>{try{lib[k]=JSON.parse(vals[k])}catch{}});
  }else try{lib=JSON.parse(localStorage.getItem('lib')||'{}')}catch{}
}
function save(k){
  if(!cs)return localStorage.setItem('lib',JSON.stringify(lib));
  lib[k]?cs.setItem(k,JSON.stringify(lib[k])):cs.removeItem(k);
}

/* TMDB */
async function api(path,p={}){
  const u=new URL(API+path);
  u.search=new URLSearchParams({api_key:TMDB_KEY,language:'ru-RU',...p}).toString();
  const r=await fetch(u);
  if(!r.ok)throw 0;
  return r.json();
}
const norm=r=>({id:r.id,type:r.media_type||(r.title?'movie':'tv'),ti:r.title||r.name||'Без названия',y:(r.release_date||r.first_air_date||'').slice(0,4),p:r.poster_path||'',r:r.vote_average?+r.vote_average.toFixed(1):0,o:(r.overview||'').slice(0,400)});

async function run(more=false){
  const my=++seq;
  if(more)page++;else{page=1;results=[]}
  busy=true;error='';render();
  try{
    const d=query?await api('/search/multi',{query,page}):await api('/trending/all/week',{page});
    if(my!==seq)return;
    pages=d.total_pages||1;
    results.push(...d.results.filter(r=>r.media_type!=='person').map(norm));
  }catch{
    if(my!==seq)return;
    error='Не удалось загрузить данные. Проверьте ключ TMDB и подключение к интернету.';
  }
  busy=false;render();
}

/* Отрисовка */
const card=it=>{
  const k=it.type+'_'+it.id,s=lib[k]?.s;seen[k]=it;
  return `<div class="c" data-k="${k}"><div class="p">${it.p?`<img loading="lazy" alt="" src="${IMG}w342${it.p}">`:'🎬'}${s?`<b class="${s}">${s==='w'?'✓':'🔖'}</b>`:''}</div><div class="t">${esc(it.ti)}</div><div class="y">${esc(it.y)}</div></div>`;
};
function render(){
  const list=tab==='search'?results:Object.values(lib).filter(x=>x.s===tab).sort((a,b)=>b.at-a.at);
  $('#top').hidden=tab!=='search';
  $('#lbl').textContent=tab==='search'&&!query?'Популярное на этой неделе':'';
  $('#grid').innerHTML=list.map(card).join('');
  $('#msg').textContent=error||(list.length?'':busy?'Загрузка…':tab==='search'?'Ничего не найдено':'Пока пусто. Найдите фильм во вкладке «Поиск» и отметьте его.');
  $('#more').hidden=tab!=='search'||busy||page>=pages||!results.length;
  $('#cr').hidden=tab!=='search';
  ['p','w'].forEach(s=>{const n=Object.values(lib).filter(x=>x.s===s).length;$('#c'+s).textContent=n?n:''});
}

/* Карточка фильма */
const key=()=>cur.type+'_'+cur.id;
const mark=()=>$$('.btns button').forEach(b=>b.classList.toggle('on',lib[key()]?.s===b.dataset.s));
function open(k){
  cur=lib[k]||seen[k];if(!cur)return;
  $('#si').style.backgroundImage=cur.p?`url(${IMG}w342${cur.p})`:'none';
  $('#st').textContent=cur.ti;
  $('#sm').innerHTML=(cur.type==='tv'?'Сериал':'Фильм')+(cur.y?', '+esc(cur.y):'')+(cur.r?'<br>★ '+cur.r:'');
  $('#so').textContent=cur.o||'Описание отсутствует.';
  mark();$('#sheet').hidden=false;tg?.BackButton?.show();
}
function close(){$('#sheet').hidden=true;tg?.BackButton?.hide()}

$$('.btns button').forEach(b=>b.onclick=()=>{
  const k=key();
  if(lib[k]?.s===b.dataset.s)delete lib[k];else lib[k]={...cur,s:b.dataset.s,at:Date.now()};
  save(k);tg?.HapticFeedback?.impactOccurred('light');close();render();
});

/* События */
let timer;
$('#q').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{query=e.target.value.trim();run()},400)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
$('#more').onclick=()=>run(true);
$('#grid').onclick=e=>{const c=e.target.closest('.c');if(c)open(c.dataset.k)};
$('#sheet').onclick=e=>{if(e.target.id==='sheet')close()};
$$('#tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  $$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#main').scrollTop=0;render();
});
tg?.BackButton?.onClick(close);
(async()=>{await load();run()})();
</script>
</body>
</html>
